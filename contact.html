<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - LACED</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .contact-container {
      max-width: 600px;
      margin: 80px auto;
      padding: 40px 20px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      text-align: center;
    }
    .contact-title {
      font-size: 2.5rem;
      font-weight: 900;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: -1px;
    }
    .contact-subtitle {
      color: #666;
      margin-bottom: 40px;
      font-size: 1.1rem;
    }
    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      width: 100%;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 8px;
      font-size: 1.2rem;
      font-weight: 700;
      text-decoration: none;
      color: #fff;
      transition: transform 0.2s, opacity 0.2s;
    }
    .social-btn:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }
    .social-btn svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }
    .btn-whatsapp { background: #25D366; }
    .btn-instagram { background: #E1306C; }
    .btn-facebook { background: #1877F2; }
    .btn-tiktok { background: #000000; }
  </style>
</head>
<body>
  <!-- Navbar -->
  <header>
    <div class="container navbar">
      <div class="hamburger">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      </div>
      <a href="index.html" class="logo">
        <img src="img/logo.png" alt="LACED Logo" class="nav-logo">
      </a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="shop.html?category=ladies">Ladies Collection</a>
        <a href="shop.html?category=mens">Men's Collection</a>
      </nav>
                        <div class="nav-icons">
        <a href="wishlist.html" style="color:white; position:relative; display:flex; align-items:center;">
          <i class="fa-regular fa-heart" style="font-size: 1.4rem;"></i>
          <span class="badge" id="wishlist-count">0</span>
        </a>
        <script>
          document.addEventListener("DOMContentLoaded", () => {
            const wl = JSON.parse(localStorage.getItem("laced_wishlist")||"[]");
            const badge = document.getElementById("wishlist-count");
            if (badge) badge.innerText = wl.length;
          });
        </script>
        
        <div class="search-icon" style="color:white; cursor:pointer; display:flex; align-items:center;">
          <i class="fa-solid fa-magnifying-glass" style="font-size: 1.3rem;"></i>
        </div>
        
        <div class="cart-icon" id="cart-icon" style="color:white; position:relative; display:flex; align-items:center; cursor:pointer;">
          <i class="fa-solid fa-bag-shopping" style="font-size: 1.4rem;"></i>
          <span class="badge" id="cart-count">0</span>
        </div>
      </div>
    </div>
  <!-- Mobile Menu -->
    <div class="mobile-menu">
      <ul class="mobile-menu-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html?category=ladies">Ladies Collection</a></li>
        <li><a href="shop.html?category=mens">Men's Collection</a></li>
      </ul>
      <div class="mobile-menu-bottom">
        <a href="#" class="login-btn">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          Log in
        </a>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="contact-container">
      <h1 class="contact-title">Contact Us</h1>
      <p class="contact-subtitle">Get in touch with us through our official channels.</p>
      
      <div id="social-links-container">
        <p>Loading contact links...</p>
      </div>
    </div>
  </div>

  <script>
    async function loadSocialLinks() {
      try {
        const res = await fetch('/api/settings');
        const settings = await res.json();
        const storeInfo = settings.storeInfo || {};
        
        const container = document.getElementById('social-links-container');
        container.innerHTML = '';
        
        let hasLinks = false;

        if (storeInfo.whatsapp) {
          hasLinks = true;
          // Extract just the number or use the link directly if it's already a link
          let waLink = storeInfo.whatsapp;
          if (!waLink.startsWith('http')) {
            waLink = 'https://wa.me/' + waLink.replace(/\D/g, '');
          }
          container.innerHTML += `
            <a href="${waLink}" target="_blank" class="social-btn btn-whatsapp">
              <svg viewBox="0 0 24 24"><path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766.001-3.187-2.575-5.77-5.764-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.299.045-.677.063-1.092-.069-.252-.08-.575-.187-.988-.365-1.739-.751-2.874-2.502-2.961-2.617-.087-.116-.708-.94-.708-1.793s.448-1.273.607-1.446c.159-.173.346-.217.462-.217l.332.006c.106.005.249-.04.39.298.144.347.491 1.2.534 1.287.043.087.072.188.014.304-.058.116-.087.188-.173.289l-.26.304c-.087.086-.177.18-.076.354.101.174.449.741.964 1.201.662.591 1.221.774 1.394.86s.274.072.376-.043c.101-.116.433-.506.549-.68.116-.173.231-.145.39-.087s1.011.477 1.184.564.289.13.332.202c.045.072.045.419-.1.824zm-3.423-14.416c-6.627 0-12 5.373-12 12s5.373 12 12 12 12-5.373 12-12-5.373-12-12-12zm.029 18.88c-1.161 0-2.305-.292-3.318-.844l-3.677.964.984-3.595c-.607-1.052-.927-2.246-.926-3.468.001-3.825 3.113-6.937 6.937-6.937 1.856.001 3.598.723 4.907 2.034 1.31 1.311 2.031 3.054 2.03 4.908-.001 3.825-3.113 6.938-6.937 6.938z"/></svg>
              Chat on WhatsApp
            </a>`;
        }

        if (storeInfo.instagram) {
          hasLinks = true;
          let igLink = storeInfo.instagram;
          if (!igLink.startsWith('http')) {
            igLink = 'https://instagram.com/' + igLink.replace('@', '');
          }
          container.innerHTML += `
            <a href="${igLink}" target="_blank" class="social-btn btn-instagram">
              <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.07zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
              Follow on Instagram
            </a>`;
        }

        if (storeInfo.facebook) {
          hasLinks = true;
          let fbLink = storeInfo.facebook;
          if (!fbLink.startsWith('http')) {
            fbLink = 'https://facebook.com/' + fbLink;
          }
          container.innerHTML += `
            <a href="${fbLink}" target="_blank" class="social-btn btn-facebook">
              <svg viewBox="0 0 24 24"><path d="M9 8h-3v4h3v12h5v-12h3.642l.358-4h-4v-1.667c0-.955.192-1.333 1.115-1.333h2.885v-5h-3.808c-3.596 0-5.192 1.583-5.192 4.615v3.385z"/></svg>
              Follow on Facebook
            </a>`;
        }

        if (storeInfo.tiktok) {
          hasLinks = true;
          let ttLink = storeInfo.tiktok;
          if (!ttLink.startsWith('http')) {
            ttLink = 'https://tiktok.com/' + (ttLink.startsWith('@') ? '' : '@') + ttLink;
          }
          container.innerHTML += `
            <a href="${ttLink}" target="_blank" class="social-btn btn-tiktok">
              <svg viewBox="0 0 24 24"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.12-3.44-3.17-3.61-5.46-.02-.33-.02-.66-.01-.99.2-2.31 1.75-4.22 3.84-5.07 1.53-.61 3.25-.56 4.74.05.01-.27.01-.54.02-.82-.01-1.28.01-2.56-.02-3.84-1.38-.28-2.82-.16-4.14.36-2.18.89-3.9 2.75-4.43 5.02-.27 1.14-.24 2.33-.06 3.47.41 2.65 2.15 4.96 4.54 5.95 2.53.97 5.4.67 7.64-.78 1.49-.96 2.54-2.5 2.87-4.22.08-.43.12-.87.12-1.31.02-5.4.01-10.8.01-16.21-.01-.06-.01-.13-.02-.19zm-3.5 17.65c.57-.02 1.11-.2 1.59-.51.7-.42 1.17-1.12 1.25-1.92.02-.2.01-.4.01-.59-.01-1.62.01-3.23-.02-4.85-.31-.05-.63-.07-.94-.07-2.36.13-4.28 2.05-4.32 4.41-.01.55.1 1.1.33 1.6.43.91 1.25 1.57 2.18 1.83.33.1.68.14 1.03.15z"/></svg>
              Follow on TikTok
            </a>`;
        }

        if (!hasLinks) {
          container.innerHTML = '<p>No contact links have been added yet.</p>';
        }

      } catch (err) {
        document.getElementById('social-links-container').innerHTML = '<p>Error loading contact links.</p>';
      }
    }
    loadSocialLinks();
  </script>
</body>
</html>
