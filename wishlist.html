<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Your Wishlist | LACED</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=1" />
</head>
<body>

  <!-- Header -->
  <header>
    <div class="container navbar">
      <a href="/" class="logo">
        <svg width="120" height="40" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
          <text x="10" y="45" font-family="'Inter', sans-serif" font-size="48" font-weight="900" fill="#000" letter-spacing="-2">LACED</text>
        </svg>
      </a>
      <div class="nav-links">
        <a href="/">Home</a>
        <a href="/shop">Shop</a>
      </div>
                        <div class="nav-icons">
        <a href="/wishlist" style="color:white; position:relative; display:flex; align-items:center;">
          <i class="fa-regular fa-heart" style="font-size: 1.4rem;"></i>
          <span class="badge" id="wishlist-count">0</span>
        </a>
        <script>
          document.addEventListener("DOMContentLoaded", () => {
            const wl = JSON.parse(localStorage.getItem("laced_wishlist")||"[]");
            const badge = document.getElementById("wishlist-count");
            if (badge) badge.innerText = wl.length;
          });
        </script>
        
        <div class="search-icon" style="color:white; cursor:pointer; display:flex; align-items:center;">
          <i class="fa-solid fa-magnifying-glass" style="font-size: 1.3rem;"></i>
        </div>
        
        <div class="cart-icon" id="cart-icon" style="color:white; position:relative; display:flex; align-items:center; cursor:pointer;">
          <i class="fa-solid fa-bag-shopping" style="font-size: 1.4rem;"></i>
          <span class="badge" id="cart-count">0</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Cart Sidebar -->
  <div class="cart-overlay" id="cart-overlay"></div>
  <div class="cart-sidebar" id="cart-sidebar">
    <div class="cart-header">
      <h3>Your Cart</h3>
      <button class="close-cart" id="close-cart">&times;</button>
    </div>
    <div class="cart-items" id="cart-items"></div>
    <div class="cart-footer">
      <div class="cart-total">
        <span>Total:</span>
        <span id="cart-total-amount">0.00 EGP</span>
      </div>
      <button class="btn btn-full">Checkout</button>
    </div>
  </div>

  <section class="container" style="padding: 60px 20px; min-height: 60vh;">
    <h1 style="font-weight: 900; text-transform: uppercase; margin-bottom: 40px; font-size: 2.5rem; text-align: center;">Your Wishlist <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #ff0000; vertical-align: middle;"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg></h1>
    
    <div class="products-grid" id="wishlist-grid">
      <!-- Injected by JS -->
    </div>
    
    <div id="empty-wishlist" style="display:none; text-align:center; padding: 50px 0;">
      <h2 style="color: #999; margin-bottom: 20px;">Your wishlist is currently empty.</h2>
      <a href="/shop" class="btn" style="background:#000; color:#fff; padding:15px 30px; text-decoration:none; border-radius:4px; font-weight:700;">Explore Sneakers</a>
    </div>
  </section>

  <script src="js/data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/app.js"></script>
  
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const grid = document.getElementById("wishlist-grid");
      const empty = document.getElementById("empty-wishlist");
      
      const savedIds = window.getWishlist();
      if (savedIds.length === 0) {
        empty.style.display = "block";
      } else {
        const wishlistProducts = products.filter(p => savedIds.includes(p.id));
        
        let html = "";
        wishlistProducts.forEach(product => {
          html += `
            <div class="product-card">
              <button class="wishlist-btn active" onclick="removeWishlistItem(event, ${product.id}, this)" style="position:absolute; top:10px; right:10px; z-index:10; background:#fff; border:none; width:36px; height:36px; border-radius:50%; display:flex; justify-content:center; align-items:center; cursor:pointer; box-shadow:0 2px 5px rgba(0,0,0,0.1); color:#ff0000;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
              </button>
              <a href="/product?id=${product.id}">
                <div class="product-img-wrap">
                  <img src="${product.image}" alt="${product.name}" class="product-img" onerror="this.onerror=null; this.src='https://via.placeholder.com/600x600?text=LACED';">
                  <span class="sale-badge">Sale</span>
                </div>
                <div class="product-info">
                  <div class="product-name">${product.name}</div>
                  <div class="product-price-container">
                    <div class="product-old-price">LE ${(product.price + 300).toFixed(2)} EGP</div>
                    <div class="product-price">LE ${product.price.toFixed(2)} EGP</div>
                  </div>
                  <div class="btn-choose">Choose options</div>
                </div>
              </a>
            </div>
          `;
        });
        grid.innerHTML = html;
      }
    });

    function removeWishlistItem(e, id, btn) {
      e.preventDefault();
      e.stopPropagation();
      window.toggleWishlist(e, id);
      btn.closest('.product-card').remove();
      
      if (window.getWishlist().length === 0) {
        document.getElementById("empty-wishlist").style.display = "block";
      }
    }
  </script>
</body>
</html>
